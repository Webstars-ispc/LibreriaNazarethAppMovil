plugins {
    id 'com.android.application'
}

// Firma de release: se lee desde keystore.properties (archivo local, NO versionado).
// Si el archivo no existe, el release se compila sin firmar (no rompe el build).
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
def tieneKeystore = keystorePropsFile.exists()
if (tieneKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.example.librerianazareth'
    compileSdk 34

    defaultConfig {
        applicationId "com.ispc.librerianazareth"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // URL base de la API (se lee desde local.properties)
        buildConfigField "String", "API_BASE_URL", "\"${getApiBaseUrl()}\""
    }

    signingConfigs {
        if (tieneKeystore) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (tieneKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    // Desactiva las animaciones en los tests instrumentados (evita flakiness)
    testOptions {
        animationsDisabled = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // Retrofit + Gson + Logging
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    // Cifrado de preferencias (tokens y datos del usuario)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // ViewModel + LiveData (arquitectura MVVM)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'

    // ---- Tests unitarios locales (app/src/test) ----
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    // ---- Tests instrumentados (app/src/androidTest) ----
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-accessibility:3.5.1'
}

// Lee API_BASE_URL desde local.properties.
// Si no está definida, usa la IP del host vista desde el emulador.
def getApiBaseUrl() {
    def props = new Properties()
    def file = rootProject.file("local.properties")
    if (file.exists()) {
        props.load(new FileInputStream(file))
    }
    return props.getProperty("API_BASE_URL", "http://10.0.2.2:8000/")
}