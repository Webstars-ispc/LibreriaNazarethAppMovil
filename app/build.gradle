plugins {
    id 'com.android.application'
    id 'jacoco'
}

// Cobertura de código (JaCoCo) — Sprint 2 (Testing)
jacoco {
    toolVersion = "0.8.11"
}

// Firma de release: se lee desde keystore.properties (archivo local, NO versionado).
// Si el archivo no existe, el release se compila sin firmar (no rompe el build).
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
def tieneKeystore = keystorePropsFile.exists()
if (tieneKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.ispc.librerianazareth'
    compileSdk 34

    defaultConfig {
        applicationId "com.ispc.librerianazareth"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // URL base de la API (se lee desde local.properties)
        buildConfigField "String", "API_BASE_URL", "\"${getApiBaseUrl()}\""
    }

    signingConfigs {
        if (tieneKeystore) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (tieneKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    // Desactiva las animaciones en los tests instrumentados (evita flakiness)
    testOptions {
        animationsDisabled = true
        // Devuelve valores por defecto en los métodos de android.* (p. ej. Log.d)
        // en los tests unitarios de la JVM, en vez de lanzar "not mocked".
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // Retrofit + Gson + Logging
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    // Tests de integración con la API
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
}

// Lee API_BASE_URL desde local.properties.
// Si no está definida, usa la IP del host vista desde el emulador.
def getApiBaseUrl() {
    def props = new Properties()
    def file = rootProject.file("local.properties")
    if (file.exists()) {
        props.load(new FileInputStream(file))
    }
    return props.getProperty("API_BASE_URL", "https://librerianazareth.alwaysdata.net/")
}

// ============================================================
// Reporte de cobertura de código (JaCoCo) — Sprint 2
// Uso: ./gradlew :app:jacocoTestReport
// Salida: app/build/reports/jacoco/jacocoTestReport/html/index.html
// ============================================================
tasks.register("jacocoTestReport", JacocoReport) {
    dependsOn "testDebugUnitTest"

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def fileFilter = [
            '**/R.class', '**/R$*.class', '**/BuildConfig.*',
            '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*'
    ]
    def mainSrc = "${project.projectDir}/src/main/java"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([
            fileTree(dir: "${buildDir}/intermediates/javac/debug/classes", excludes: fileFilter)
    ]))
    executionData.setFrom(files([
            fileTree(dir: buildDir, includes: [
                    "jacoco/testDebugUnitTest.exec",
                    "outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec"
            ])
    ]))
}